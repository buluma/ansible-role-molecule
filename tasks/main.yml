---
# tasks file for molecule

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install requirements
  ansible.builtin.package:
    name: "{{ molecule_requirements }}"
  become: true
  become_user: root

- name: Install molecule (pip)
  ansible.builtin.pip:
    name: molecule
    extra_args: "{{ molecule_extra_args | default(omit) }}"
    break_system_packages: "{{ molecule_break_system_packages }}"

- name: Install molecule-plugins (pip)
  ansible.builtin.pip:
    name: "{{ molecule_plugins }}"
    extra_args: "{{ molecule_extra_args | default(omit) }}"
    break_system_packages: "{{ molecule_break_system_packages }}"

- name: Ensure a Python 3.13+-compatible ansible-core is installed
  when:
    - ansible_facts['python_version'] is version('3.13', '>=')
  block:
    - name: Install ansible-core (pip)
      ansible.builtin.pip:
        name: "ansible-core>=2.20.0"
        extra_args: "{{ molecule_extra_args | default(omit) }}"
        break_system_packages: "{{ molecule_break_system_packages }}"
  rescue:
    - name: Force-reinstall ansible-core (pip)
      ansible.builtin.pip:
        name: "ansible-core>=2.20.0"
        extra_args: "--ignore-installed {{ molecule_extra_args }}"
        break_system_packages: "{{ molecule_break_system_packages }}"
